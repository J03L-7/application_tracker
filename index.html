<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <rect width="26" height="26" rx="7" fill="#6366f1"/>
          <path d="M7 13h12M7 8.5h12M7 17.5h8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>AppTrackr</span>
      </div>

      <div class="nav-section">
        <p class="nav-section-label">Overview</p>
        <ul class="nav-links">
          <li><a href="#" class="nav-link active" data-view="dashboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            Dashboard
          </a></li>
          <li><a href="#" class="nav-link" data-view="companies">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 21h18M3 7v1a3 3 0 006 0V7m0 1a3 3 0 006 0V7m0 1a3 3 0 006 0V7H3l2-4h14l2 4"/><path d="M5 21V11M19 21V11M9 21v-4a2 2 0 014 0v4"/></svg>
            Companies
          </a></li>
          <li><a href="#" class="nav-link" data-view="applications">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            All Applications
          </a></li>
        </ul>
      </div>

      <div class="sidebar-footer">
        <button class="btn btn-primary btn-full" id="add-app-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New Application
        </button>
      </div>
    </nav>

    <!-- Main -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="top-bar-right">
          <span class="date-chip" id="date-display"></span>
        </div>
      </header>

      <div class="content-area" id="content-area"></div>
    </main>
  </div>

  <!-- ── Application Modal ── -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <div>
          <h2 id="modal-title">New Application</h2>
          <p id="modal-subtitle" class="modal-subtitle"></p>
        </div>
        <button class="icon-btn" id="modal-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <form id="app-form">
        <input type="hidden" id="form-id" />

        <!-- Section: Position -->
        <div class="form-section">
          <div class="form-section-label">Position</div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-company">Company *</label>
              <input type="text" id="form-company" placeholder="e.g. Stripe" required autocomplete="off" />
            </div>
            <div class="form-group">
              <label for="form-role">Job Title *</label>
              <input type="text" id="form-role" placeholder="e.g. Senior Engineer" required />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-status">Status *</label>
              <select id="form-status" required>
                <option value="Applied">Applied</option>
                <option value="Phone Screen">Phone Screen</option>
                <option value="Interview">Interview</option>
                <option value="Technical">Technical</option>
                <option value="Offer">Offer</option>
                <option value="Rejected">Rejected</option>
                <option value="Withdrawn">Withdrawn</option>
              </select>
            </div>
            <div class="form-group">
              <label for="form-date">Date Applied *</label>
              <input type="date" id="form-date" required />
            </div>
          </div>
        </div>

        <!-- Section: Details -->
        <div class="form-section">
          <div class="form-section-label">Details</div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-location">Location</label>
              <input type="text" id="form-location" placeholder="e.g. London / Remote" />
            </div>
            <div class="form-group">
              <label for="form-salary">Salary Range</label>
              <input type="text" id="form-salary" placeholder="e.g. £60k – £80k" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-type">Job Type</label>
              <select id="form-type">
                <option value="">Not specified</option>
                <option value="Full-time">Full-time</option>
                <option value="Part-time">Part-time</option>
                <option value="Contract">Contract</option>
                <option value="Internship">Internship</option>
                <option value="Freelance">Freelance</option>
              </select>
            </div>
            <div class="form-group">
              <label for="form-source">Source</label>
              <input type="text" id="form-source" placeholder="e.g. LinkedIn, Referral" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-domain">Company Domain</label>
              <input type="text" id="form-domain" placeholder="e.g. stripe.com" />
            </div>
            <div class="form-group">
              <label for="form-url">Job URL</label>
              <input type="url" id="form-url" placeholder="https://..." />
            </div>
          </div>
        </div>

        <!-- Section: Application -->
        <div class="form-section">
          <div class="form-section-label">Application</div>
          <div class="form-group">
            <label for="form-cv">CV / Resume Used</label>
            <input type="text" id="form-cv" placeholder="e.g. CV_SeniorEng_2026.pdf" />
          </div>
          <div class="form-group">
            <label for="form-description">Job Description</label>
            <textarea id="form-description" rows="4" placeholder="Paste the job description here..."></textarea>
          </div>
        </div>

        <!-- Section: Contact -->
        <div class="form-section">
          <div class="form-section-label">Contact</div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-contact-name">Contact Name</label>
              <input type="text" id="form-contact-name" placeholder="e.g. Sarah Johnson" />
            </div>
            <div class="form-group">
              <label for="form-contact-email">Contact Email</label>
              <input type="email" id="form-contact-email" placeholder="e.g. sarah@company.com" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="form-contact-phone">Contact Phone</label>
              <input type="tel" id="form-contact-phone" placeholder="e.g. +44 7700 900000" />
            </div>
            <div class="form-group"></div>
          </div>
        </div>

        <!-- Section: Notes -->
        <div class="form-section">
          <div class="form-section-label">Notes</div>
          <div class="form-group">
            <textarea id="form-notes" rows="3" placeholder="Any notes, interview prep, follow-up reminders..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Application</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── Delete Confirm ── -->
  <div class="modal-overlay" id="delete-overlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete application?</h2>
        <button class="icon-btn" id="delete-close" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body-simple">
        <p>This will permanently delete this application record. This action cannot be undone.</p>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="delete-cancel">Cancel</button>
          <button class="btn btn-danger" id="delete-confirm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
