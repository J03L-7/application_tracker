<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect width="28" height="28" rx="8" fill="#6366f1"/>
            <path d="M7 14h14M7 9h14M7 19h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="logo-text">AppTrackr</span>
        </div>
      </div>
      <ul class="nav-links">
        <li><a href="#" class="nav-link active" data-view="dashboard">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a></li>
        <li><a href="#" class="nav-link" data-view="applications">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          Applications
        </a></li>
        <li><a href="#" class="nav-link" data-view="kanban">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="5" height="18"/><rect x="10" y="3" width="5" height="13"/><rect x="17" y="3" width="5" height="8"/></svg>
          Pipeline
        </a></li>
      </ul>
      <div class="sidebar-footer">
        <button class="btn btn-primary btn-full" id="add-app-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add Application
        </button>
      </div>
    </nav>

    <!-- Main content -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <button class="menu-toggle" id="menu-toggle">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="page-title" id="page-title">Dashboard</h1>
        </div>
        <div class="top-bar-right">
          <span class="date-display" id="date-display"></span>
        </div>
      </header>

      <div class="content-area" id="content-area">
        <!-- Views rendered here by JS -->
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Application</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <form id="app-form" class="modal-body">
        <input type="hidden" id="form-id" />

        <div class="form-row">
          <div class="form-group">
            <label for="form-company">Company *</label>
            <input type="text" id="form-company" placeholder="e.g. Google" required />
          </div>
          <div class="form-group">
            <label for="form-role">Role *</label>
            <input type="text" id="form-role" placeholder="e.g. Software Engineer" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="form-status">Status *</label>
            <select id="form-status" required>
              <option value="Applied">Applied</option>
              <option value="Phone Screen">Phone Screen</option>
              <option value="Interview">Interview</option>
              <option value="Technical">Technical</option>
              <option value="Offer">Offer</option>
              <option value="Rejected">Rejected</option>
              <option value="Withdrawn">Withdrawn</option>
            </select>
          </div>
          <div class="form-group">
            <label for="form-date">Date Applied *</label>
            <input type="date" id="form-date" required />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="form-location">Location</label>
            <input type="text" id="form-location" placeholder="e.g. London, Remote" />
          </div>
          <div class="form-group">
            <label for="form-salary">Salary Range</label>
            <input type="text" id="form-salary" placeholder="e.g. £60k–£80k" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="form-type">Job Type</label>
            <select id="form-type">
              <option value="">Select...</option>
              <option value="Full-time">Full-time</option>
              <option value="Part-time">Part-time</option>
              <option value="Contract">Contract</option>
              <option value="Internship">Internship</option>
              <option value="Freelance">Freelance</option>
            </select>
          </div>
          <div class="form-group">
            <label for="form-source">Source</label>
            <input type="text" id="form-source" placeholder="e.g. LinkedIn, Referral" />
          </div>
        </div>

        <div class="form-group">
          <label for="form-url">Job URL</label>
          <input type="url" id="form-url" placeholder="https://..." />
        </div>

        <div class="form-group">
          <label for="form-notes">Notes</label>
          <textarea id="form-notes" rows="3" placeholder="Any notes about this application..."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Application</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="delete-overlay">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete Application</h2>
        <button class="modal-close" id="delete-close">&times;</button>
      </div>
      <div class="modal-body">
        <p style="margin-bottom:1.5rem;color:var(--text-secondary)">Are you sure you want to delete this application? This cannot be undone.</p>
        <div class="modal-footer">
          <button class="btn btn-secondary" id="delete-cancel">Cancel</button>
          <button class="btn btn-danger" id="delete-confirm">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
